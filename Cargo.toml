[package]
name = "ps5-emulator"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.10"
crossbeam = "0.8"

# Para Android
[target.'cfg(target_os="android")'.dependencies]
jni = "0.21"
android_logger = "0.13"

# Para Web (Chromebook)
[target.'cfg(target_arch="wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.release]
lto = true
strip = true
opt-level = 3

[features]
default = ["desktop"]
desktop = []
android = ["jni", "android_logger"]
wasm = ["wasm-bindgen", "web-sys"]
